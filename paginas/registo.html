<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registo - MozTrip</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="register-container">

    <div class="register-card">

        <h1>Criar Conta</h1>
        <p>Junte-se ao MozTrip e descubra Moçambique.</p>

        <form>

            <label>Tipo de Conta</label>

            <select required>
                <option value="">Selecione</option>
                <option>Turista</option>
                <option>Hotel</option>
                <option>Agência de Viagens</option>
                <option>Aluguer de Viaturas</option>
                <option>Guia Turístico</option>
            </select>

            <label>Nome Completo</label>
            <input type="text" placeholder="Digite o seu nome" required>

            <label>Email</label>
            <input type="email" placeholder="Digite o seu email" required>

            <label>Telefone</label>
            <input type="tel" placeholder="+258" required>

            <label>Província</label>
            <select required>
                <option value="">Selecione a província</option>
                <option>Maputo</option>
                <option>Gaza</option>
                <option>Inhambane</option>
                <option>Sofala</option>
                <option>Manica</option>
                <option>Tete</option>
                <option>Zambézia</option>
                <option>Nampula</option>
                <option>Cabo Delgado</option>
                <option>Niassa</option>
            </select>

            <label>Palavra-passe</label>
            <input type="password" placeholder="Crie uma palavra-passe" required>

            <label>Confirmar Palavra-passe</label>
            <input type="password" placeholder="Repita a palavra-passe" required>

            <button type="submit">
                Criar Conta
            </button>

        </form>

        <div class="login-link">
            Já possui conta?
            <a href="login.html">Entrar</a>
        </div>

    </div>

</div>

</body>
</html>
